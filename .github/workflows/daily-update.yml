name: Daily data update

on:
  schedule:
    # 21:05 UTC = 翌日 06:05 JST
    - cron: "5 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore fixed JMA catalogs
        id: fixed-cache
        uses: actions/cache@v5
        with:
          path: data/fixed
          key: jma-fixed-catalogs-1998-2023-v1

      - name: Download fixed JMA catalogs on cache miss
        if: steps.fixed-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/fixed
          for year in $(seq 1998 2023); do
            curl --fail --retry 3 --location --output "data/fixed/h${year}.zip" \
              "https://www.data.jma.go.jp/eqev/data/bulletin/data/hypo/h${year}.zip"
          done

      - name: Update the current provisional catalog
        run: |
          year=$(TZ=Asia/Tokyo date +%Y)
          python update_jma_provisional.py data/catalog \
            --output-file "data/catalog/provisional_${year}.csv" \
            --start-date "${year}-01-01" --refresh-last-day

      - name: Rebuild recent b-value maps
        run: |
          find web/data/recent -type f ! -name .gitkeep -delete
          python jma_bvalue_map.py data/fixed \
            --first-year 1998 --last-year 2023 \
            --provisional-files data/catalog/provisional_*.csv \
            --short-grid 1.0 --long-grid 0.5 \
            --output-dir web/data/recent
          python generate_web_manifest.py

      - name: Rebuild foreshock activity monitor
        run: |
          python generate_foreshock_alerts.py data/catalog/provisional_*.csv
          python generate_foreshock_backtest.py data/catalog/provisional_*.csv --start 2024-01-01

      - name: Commit refreshed public data and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/catalog/provisional_*.csv web/data/recent web/data/alerts web/manifest.json
          if git diff --cached --quiet; then
            echo "No data or figure changes to commit."
            exit 0
          fi

          git commit -m "Update JMA data and recent maps"

          if ! git push origin HEAD:refs/heads/main; then
            echo "::error::Push to main failed. If main advanced, start a fresh Daily data update run on main."
            exit 1
          fi
