name: Daily data update

on:
  schedule:
    # 21:05 UTC = 06:05 JST. Scheduled runs can start several minutes late.
    - cron: "5 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore fixed JMA catalogs
        id: fixed-cache
        uses: actions/cache@v5
        with:
          path: data/fixed
          key: jma-fixed-catalogs-1998-2023-v1

      - name: Download fixed JMA catalogs on cache miss
        if: steps.fixed-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/fixed
          for year in $(seq 1998 2023); do
            curl --fail --retry 3 --location --output "data/fixed/h${year}.zip" \
              "https://www.data.jma.go.jp/eqev/data/bulletin/data/hypo/h${year}.zip"
          done

      - name: Update the current provisional catalog
        run: |
          year=$(TZ=Asia/Tokyo date +%Y)
          python update_jma_provisional.py data/catalog \
            --output-file "data/catalog/provisional_${year}.csv" \
            --start-date "${year}-01-01" --refresh-last-day

      - name: Rebuild recent b-value maps
        run: |
          find web/data/recent -type f ! -name .gitkeep -delete
          python jma_bvalue_map.py data/fixed \
            --first-year 1998 --last-year 2023 \
            --provisional-files data/catalog/provisional_*.csv \
            --short-grid 1.0 --long-grid 0.5 \
            --output-dir web/data/recent
          python generate_web_manifest.py

      - name: Commit refreshed public data and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/provisional_*.csv web/data/recent web/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update JMA data and recent maps"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
